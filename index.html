const fr=(s,len)=>(s-GRID0)/len;
const STAGES=[
 {id:'desert',jumps:[640,1050,1390],name:'DESERT',sub:'Dune Run',diff:1,len:1500,hw:7,seed:11,vmax:56,th0:0,sky:0x5f9fee,fog:0xe6dcb8,fogN:120,fogF:600,gA:[.58,.6,.32],gB:[.76,.56,.36],hill:7,deco:'acacia',skill:.93,cpf:[.41,.74],
