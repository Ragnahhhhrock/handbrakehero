function aiStep(a,dt,P){

  if(P&&P.s>a.s&&P.s-a.s<14&&Math.abs(P.lat-a.lat)<2.3&&P.s-a.s<nd){nd=P.s-a.s;near={v:Math.max(P.v,3),lat:P.lat}}

function loadHS(){let h=null;try{h=JSON.parse(store.get('r90-hs')||'null')}catch(e){}if(!h||!h.length)h=[['CMR',81250,1],['TMK',74000,1],['JKK',68900,1],['CSZ',60500,2],['DAU',52000,3],['BTH',44000,4],['FDL',38000,5],['KEN',31000,7],['MSK',24000,9],['AAA',16000,12]];return h}
function hsTable(me){const h=loadHS();return '<table><tr><th>#</th><th>NAME</th><th>PLACE</th><th>SCORE</th></tr>'+h.slice(0,10).map((r,i)=>`<tr class="${me===i?'me':''}"><td>${i+1}</td><td>${r[0]}</td><td>${r[2]}</td><td>${r[1]}</td></tr>`).join('')+'</table>'}
let ini=[0,0,0];const AZ='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function initials(){const h=loadHS();if(GS.score<=(h[h.length-1]||[0,0])[1]){scores(-1);return}GS.mode='initials';ini=[0,0,0];ini.pos=0;drawInitials()}
function drawInitials(){showCard(`<div class="in" style="text-align:center"><h2>${GS.champion?'WORLD CHAMPION':'HIGH SCORE'} · ${GS.score}</h2><h1>Enter your initials</h1><div class="ini">${[0,1,2].map(i=>`<div><button data-u="${i}" aria-label="Letter up">▲</button><b style="${ini.pos===i?'':'border-color:#fff4'}">${AZ[ini[i]]}</b><button data-d="${i}" aria-label="Letter down">▼</button></div>`).join('')}</div><div class="row" style="justify-content:center"><button class="go" id="ok">OK</button></div><div class="keys">Type letters or tap the arrows. Enter to confirm.</div></div>`);
  card.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const i=+b.dataset.u;ini[i]=(ini[i]+1)%26;ini.pos=i;drawInitials()});card.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const i=+b.dataset.d;ini[i]=(ini[i]+25)%26;ini.pos=i;drawInitials()});$('#ok').onclick=submitHS}
function initKey(e){if(/^Key[A-Z]$/.test(e.code)){ini[ini.pos]=AZ.indexOf(e.code[3]);ini.pos=Math.min(2,ini.pos+1);drawInitials();e.preventDefault()}else if(e.code==='ArrowUp'||e.code==='ArrowDown'){ini[ini.pos]=(ini[ini.pos]+(e.code==='ArrowUp'?1:25))%26;drawInitials();e.preventDefault()}else if(e.code==='ArrowLeft'){ini.pos=Math.max(0,ini.pos-1);drawInitials()}else if(e.code==='ArrowRight'){ini.pos=Math.min(2,ini.pos+1);drawInitials()}else if(e.code==='Enter'){submitHS();e.preventDefault()}else if(e.code==='Backspace'){ini.pos=Math.max(0,ini.pos-1);drawInitials()}}
function submitHS(){const h=loadHS();h.push([ini.map(i=>AZ[i]).join(''),GS.score,GS.place]);h.sort((a,b)=>b[1]-a[1]);const at=h.findIndex(r=>r[1]===GS.score&&r[0]===ini.map(i=>AZ[i]).join(''));h.length=Math.min(h.length,10);store.set('r90-hs',JSON.stringify(h));GS.mode='scores';scores(at)}
function scores(me){GS.mode='scores';showCard(`<div class="in"><h2>HIGH SCORES</h2><h1>Hall of fame</h1>${hsTable(me)}<div class="row"><button class="go" id="again">Play again</button><button id="tt">Title</button></div></div>`);$('#again').onclick=()=>{hideCard();document.body.classList.remove('playing');newGame()};$('#tt').onclick=title;$('#again').focus()}
function title(){GS.mode='title';document.body.classList.remove('playing');disposeWorld();const sel=store.get('r90-car')||'imp';selectCar(sel);
  showCard(`<div class="in"><h2>WORLD RALLY CHAMPIONSHIP · 1995</h2><h1>Rally 90s Championship</h1><p><b>Championship:</b> 15 cars, 3 stages, beat the clock. Start last, finish first, and a bonus stage awaits.<br><b>Practice:</b> pick any stage, no time limit.</p>
    <table><tr><td>1 · Desert</td><td class="stars">★☆☆</td></tr><tr><td>2 · Forest</td><td class="stars">★★☆</td></tr><tr><td>3 · Mountain</td><td class="stars">★★★</td></tr><tr><td>Bonus · Lakeside</td><td class="stars">win stage 3</td></tr></table>
    <div class="row" id="carRow" role="group" aria-label="Choose your car">${CARS.map(c=>`<button data-car="${c.id}" aria-pressed="${c.id===sel}">${c.short}</button>`).join('')}</div><div class="keys" id="carNote"></div>
    <div class="row"><button class="go" id="start">Championship</button><button class="go alt" id="prac" style="border-color:#fff">Practice</button></div><div class="row"><button id="hsb">High scores</button></div>
    <div class="keys konly">↑/W gas · ↓/S brake · ←→/AD steer · Space handbrake (slides the tail in tight corners) · C camera · R back on road (−3 s) · Esc twice to quit</div><div class="keys tonly">Left thumb: drag up for gas, down to brake, left/right to steer · BRAKE and HB buttons · ◉ camera</div></div>`);
  const note=()=>$('#carNote').textContent=carDef.short+': '+carDef.note;note();card.querySelectorAll('[data-car]').forEach(b=>b.onclick=()=>{selectCar(b.dataset.car);card.querySelectorAll('[data-car]').forEach(x=>x.setAttribute('aria-pressed',x===b));note()});
  $('#start').onclick=()=>{hideCard();newGame()};$('#hsb').onclick=()=>scores(-1);$('#prac').onclick=practiceMenu;$('#start').focus()}
document.head.insertAdjacentHTML('beforeend','<style>body.touch .konly{display:none}body:not(.touch) .tonly{display:none}</style>');

// ================= autopilot (testing) =================
function autoDrive(){const sk=AUTO.skill||.9,s=C.s,v=Math.max(C.vf,0.1),L=7+v*.55,p=pathAt(s+L),nx=-p.tz,nz=p.tx,tx=p.x+nx*(AUTO.lane||0),tz=p.z+nz*(AUTO.lane||0);
  const want=Math.atan2(tx-C.x,-(tz-C.z)),e=wrapA(want-C.H),ms=steerLim(C.vf);let ax=clamp(e*1.3/Math.max(ms,.05)*.6,-1,1);
  const vt=Math.min(PROF[Math.min(Math.floor((s+v*.5)/ds),N-1)],PROF[Math.min(Math.floor((s+v*1.2+8)/ds),N-1)])*sk;
  if(Math.abs(C.vf)<2&&GS.mode==='run'){AUTO._st=(AUTO._st||0)+1/60}else if(Math.abs(C.vf)>6)AUTO._st=0;
  if((AUTO._st||0)>1.2){if(AUTO._st>2.6)AUTO._st=0;return{up:0,dn:true,hb:false,ax:-ax}}
  return{up:v<vt?1:0,dn:v>vt*1.06&&C.vf>1.5,hb:false,ax}}

// ================= main loop =================
let last=performance.now(),camLook=new THREE.Vector3(),tmp=new THREE.Vector3();
function hudUpdate(){const kmh=Math.abs(C.vf)*3.6;$('#kmh').textContent=Math.round(kmh);const gs=[0,14,24,33,42,51,99],gi=gs.findIndex((x,k)=>Math.abs(C.vf)<gs[k+1]);$('#gear').textContent=C.vf<-.5?'R':kmh<2?'N':gi+1;
  $('#pos').textContent=GS.rankNow||GS.place;$('#tleft').textContent=GS.practice?fmt(rt):Math.max(0,Math.ceil(tl));$('#timeB').className='hud'+(tl<8&&GS.mode==='run'?' low':'');$('#stg').textContent='STAGE '+(GS.stage+1)+' · '+ST.name;
  const c=$('#progC'),x=c.getContext('2d'),W=c.width,H=c.height;x.clearRect(0,0,W,H);x.fillStyle='#ffffff40';x.fillRect(0,H/2-3,W,6);const f=s=>clamp((s-START_S)/(FIN_S-START_S),0,1)*(W-20)+10;
  x.fillStyle='#ffffff';CPS.forEach(s=>x.fillRect(f(s)-2,H/2-10,4,20));x.fillStyle='#ff4040';x.fillRect(W-12,H/2-12,5,24);for(const a of AIS){x.fillStyle='#ffffffa0';x.beginPath();x.arc(f(a.s),H/2,6,0,7);x.fill()}x.fillStyle='#ffd400';x.beginPath();x.arc(f(C.s),H/2,10,0,7);x.fill()}
function poseCar(dt){const i=C.idx,gr=(PY[Math.min(i+1,N-1)]-PY[Math.max(i-1,0)])/(2*ds);
  const tp=C.air?clamp(C.vy/Math.max(Math.abs(C.vf),8),-.5,.5)*-1:-Math.atan(gr*Math.cos(C.H-Math.atan2(TX[i],-TZ[i])));C.pitch+=(tp-C.pitch)*Math.min(1,dt*6);C.roll+=(clamp(-C.w*C.vf*.006,-.1,.1)-C.roll)*Math.min(1,dt*5);
  placeMesh(pCar,C.x,C.y,C.z,C.H,C.pitch,C.roll,C.vf*dt/.33,C.steer);playerGrp.position.set(0,0,0);
  const sp=Math.hypot(C.vx,C.vz),vh=Math.atan2(C.vx,-C.vz),tg=sp>6?vh:C.H,dy=wrapA(tg-camYaw);camYaw+=dy*(1-Math.exp(-dt*3.2));const cy=C.H+clamp(wrapA(camYaw-C.H),-.9,.9),fx=Math.sin(cy),fz=-Math.cos(cy);
  if(camMode===2){cam.position.set(C.x+Math.sin(C.H)*.3,C.y+1.2,C.z-Math.cos(C.H)*.3);camLook.set(C.x+Math.sin(C.H)*20,C.y+1,C.z-Math.cos(C.H)*20)}
  else{const pk=ASP<1?1+Math.min(.35,(1-ASP)*.7):1,back=(camMode?11:7)*pk,hi=(camMode?4.8:2.7)*(1+(pk-1)*.8);tmp.set(C.x-fx*back,C.y+hi,C.z-fz*back);const th=terr(tmp.x,tmp.z)+1.2;if(tmp.y<th&&tNd>PLAT)tmp.y=th;
    if(GS.mode==='run')cam.position.lerp(tmp,1-Math.exp(-dt*9));else cam.position.copy(tmp);camLook.set(C.x+fx*5,C.y+1.1,C.z+fz*5)}
  cam.lookAt(camLook);const wf=(camMode===2?74:62)+(ASP<1?Math.min(24,(1-ASP)*55):0)+Math.min(8,Math.abs(C.vf)*.1);if(Math.abs(cam.fov-wf)>.3){cam.fov=wf;cam.updateProjectionMatrix()}pCar.visible=camMode!==2;
  sun.position.set(C.x+SUNV.x*300,C.y+SUNV.y*300,C.z+SUNV.z*300);sun.target.position.set(C.x,C.y,C.z);sun.target.updateMatrixWorld();if(waterM){waterM.position.x=C.x;waterM.position.z=C.z}if(backdrop)backdrop.position.set(cam.position.x,minY-10,cam.position.z)}
function tick(dt){
  for(let i=GS.timers.length-1;i>=0;i--){const t=GS.timers[i];t.t-=dt;if(t.t<=0){GS.timers.splice(i,1);t.fn()}}
  if(GS.mode==='replay'){replayTick(dt);return}
  if(!ST||!pCar)return;
  const play=GS.mode==='run'||GS.mode==='count'||GS.mode==='fin'||GS.mode==='over';
  if(GS.mode==='count'){countdown-=dt;const c=Math.ceil(countdown-.4);const m=$('#msg');m.className='hud y';m.style.opacity=1;m.textContent=countdown>.4?c:'GO!';if(countdown<=0){GS.mode='run';setTimeout(()=>m.style.opacity=0,500)}if(ac&&c!==GS._c){GS._c=c;beep(c>0?440:880,.15)}}
  if(GS.mode==='run'||GS.mode==='fin'||GS.mode==='over'||GS.mode==='count'){
    const racing=GS.mode==='run'||GS.mode==='fin'||GS.mode==='over';const P={s:C.s,lat:C.lat,v:Math.max(C.vf,0)};
    for(const a of AIS){if(racing)aiStep(a,dt,P);else{const p=pathAt(a.s);a.x=p.x-p.tz*a.lat;a.z=p.z+p.tx*a.lat;a.H=Math.atan2(p.tx,-p.tz);a.y=p.y}}
    if(GS.mode==='run'){const inp=inputs(),n=5;for(let s=0;s<n;s++)step(dt/n,inp)}else if(GS.mode==='count'){C.vx=C.vz=C.w=0;track()}
    else if(GS.mode==='fin'||GS.mode==='over'){step(dt,{up:0,dn:C.vf>1.5,hb:false,ax:0})}
    // car-car contact
    for(const a of AIS){const dx=C.x-a.x,dz=C.z-a.z,d=Math.hypot(dx,dz);if(d<2.5&&Math.abs(C.y-a.y)<1.6&&d>.01){const nx=dx/d,nz=dz/d,av=pathAt(a.s),avx=av.tx*a.v,avz=av.tz*a.v,vn=(C.vx-avx)*nx+(C.vz-avz)*nz;C.x+=nx*(2.5-d);C.z+=nz*(2.5-d);if(vn<0){C.vx-=1.25*vn*nx;C.vz-=1.25*vn*nz;C.vx*=.97;C.vz*=.97;a.hit=.8;if(vn<-3&&performance.now()-slideT>500){slideT=performance.now();if(ac)beep(120,.08,.12)}}}}
    if(GS.mode==='run'){rt+=dt;tl-=dt;const rk=rankNow();GS.rankNow=rk;
      if(rk<lastRank){const gained=lastRank-rk;GS.passesStage+=gained;flash('PASSED<br><small>'+rk+ord(rk)+' PLACE</small>',900,'y');GS.events.push({si:GS.stage,t:rt,w:2+(rk<=3?2:0)+(rk===1?3:0),type:rk===1?'lead':'overtake'});if(ac)beep(660,.1);const d=$('#posd');d.textContent='▲'+gained;setTimeout(()=>d.textContent='',1200)}
      lastRank=rk;
      if(cpDone<2&&C.s>=CPS[cpDone]){if(!GS.practice)tl+=SECT[cpDone+1];cpDone++;flash('CHECKPOINT<br><small>'+(GS.practice?fmt(rt):'+'+Math.round(SECT[cpDone])+' SECONDS')+'</small>',1600,'y');if(ac){beep(900,.1);setTimeout(()=>beep(1200,.14),110)}}
      if(C.s>=FIN_S){finishStage()}else if(tl<=0){timeUp()}}
    // recording at 20 Hz
    if(GS.mode==='run'){recT+=dt;while(recT>=.05){recT-=.05;const f=new Float32Array(FR);f[0]=rt;f[1]=C.x;f[2]=C.z;f[3]=C.H;f[4]=C.y;f[5]=C.pitch;f[6]=C.roll;f[7]=C.steer;f[8]=C.vf;AIS.forEach((a,q)=>{const j=9+q*4;f[j]=a.x;f[j+1]=a.z;f[j+2]=a.y;f[j+3]=a.H});curRec.buf.push(f)}
      if(C.air){C._at=(C._at||0)+dt}else{if(C._at>.55)GS.events.push({si:GS.stage,t:rt-C._at/2,w:3+C._at*2,type:'jump'});C._at=0}
      const sl=Math.abs(C.vr)>5.5&&Math.abs(C.vf)>14&&!C.air;if(sl){C._sl=(C._sl||0)+dt;if(C._sl>1&&!C._slg){C._slg=1;GS.events.push({si:GS.stage,t:rt,w:2.2,type:'slide'})}}else{C._sl=0;C._slg=0}}
    note();hudUpdate();ensureChunks(C.x,C.z,2,3);
    const tf=tunnelFactor(C.idx);lightFor(tf);
    AIS.forEach(a=>{placeMesh(a.mesh,a.x,a.y,a.z,a.H,0,0,a.v*dt/.33,0)});poseCar(dt);
    if(ac&&gainN){const f=45+clamp(Math.abs(C.vf)/50,0,1)*180,t=ac.currentTime;osc1.frequency.setTargetAtTime(f,t,.04);osc2.frequency.setTargetAtTime(f*.5,t,.04);filt.frequency.setTargetAtTime(400+f*8*(.5+.5*C.thr),t,.05);gainN.gain.setTargetAtTime(play?.05+C.thr*.06:0,t,.1);nGain.gain.setTargetAtTime(Math.abs(C.vr)>2&&!C.air?clamp((Math.abs(C.vr)-2)/8,0,1)*.08:0,t,.05)}}
}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(!window.__pause)tick(dt);R.render(scene,cam)}
window.RALLY={GS,C,tick,get AIS(){return AIS},get ST(){return ST},get N(){return N},get PROF(){return PROF},get tl(){return tl},get rt(){return rt},set AUTO(v){AUTO=v},newGame,buildStage,setupGrid,startStage,K,STAGES,get SECT(){return SECT},selectCar,startPractice,practiceMenu,crown,startReplay,initials,scores,get tunRange(){return tunRange},get FIN_S(){return FIN_S},go(){hideCard();GS.mode='count';countdown=.5;document.body.classList.add('playing')},skipCards(){card.querySelector('#go')&&card.querySelector('#go').click()},get cardHTML(){return card.innerHTML},pause(v){window.__pause=v}};
$('#load').remove();ensureAI();title();requestAnimationFrame(frame);
})().catch(e=>{document.querySelector('#load').textContent='Could not start: '+e.message;console.error(e)});
